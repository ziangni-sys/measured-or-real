[project]
name = "erel-pipeline"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "scipy",
    "pyarrow",
    "matplotlib",
]

[tool.uv]
package = false
default-groups = ["dev", "figures"]

[tool.ruff]
line-length = 120

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
figures = [
    "pandas",
    "pymupdf<2",
]
